<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Simples - Controle de Produtos</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="cabecalho-conteudo"><span class="marca">LS</span><div><h1>Loja Simples</h1><p>Controle de produtos com HTML, CSS e JavaScript</p></div></div></header>
<main>
<section class="cartao"><div class="titulo-secao"><div><p class="etiqueta">CADASTRO</p><h2>Novo produto</h2></div><span class="icone" id="batata-cadastro">+</span></div>
<form id="form-produto">
<label for="nome">Nome</label><input type="text" id="nome" placeholder="Ex.: Caderno" required>
<label for="preco">Preço (R$)</label><input type="number" id="preco" step="0.01" min="0" placeholder="Ex.: 12.50" required>
<label for="quantidade">Quantidade</label><input type="number" id="quantidade" min="0" placeholder="Ex.: 10" required>
<p id="mensagem-erro" class="mensagem-erro" hidden></p><button type="submit" id="botao-formulario">Adicionar produto</button>
</form></section>
<section class="cartao"><div class="titulo-secao"><div><p class="etiqueta">ESTOQUE</p><h2>Produtos cadastrados</h2></div><span class="contador" id="contador-produtos">0</span></div>
<p id="lista-vazia" class="lista-vazia">Nenhum produto cadastrado.</p><ul id="lista-produtos"></ul></section>
</main>
<footer><p>Loja Simples • Projeto acadêmico de Fundamentos Web</p><small>Desenvolvido com HTML, CSS e JavaScript puro.</small></footer>
<script src="script.js"></script>
</body></html>
